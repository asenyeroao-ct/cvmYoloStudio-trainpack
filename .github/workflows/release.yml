name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v
      - name: Build zip and sha256
        run: python scripts/build_release.py --tag "$TAG"
      - name: Create or update the release
        run: |
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            protocol="$(python scripts/build_release.py --print protocol)"
            gh release create "$TAG" -R "$REPO" --title "$TAG" \
              --notes "ul_bridge ${TAG#v} (protocol_version ${protocol}). License: AGPL-3.0-or-later."
          fi
          gh release upload "$TAG" dist/* -R "$REPO" --clobber
      - name: Verify the uploaded assets
        run: |
          mkdir check
          gh release download "$TAG" -R "$REPO" -D check
          cd check
          sha256sum -c ./*.sha256
          cmp "ul_bridge-${TAG#v}.zip" "../dist/ul_bridge-${TAG#v}.zip"
